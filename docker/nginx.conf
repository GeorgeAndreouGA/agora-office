# Greek Office — container nginx (unprivileged, read-only root filesystem).
# Serves static files only. TLS, HSTS and the public subpath are handled by the HOST nginx,
# which forwards to 127.0.0.1:<port> with the prefix stripped.

worker_processes 1;                 # one CPU is allotted on the Raspberry Pi; static files need no more
worker_rlimit_nofile 4096;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Everything writable lives in the /tmp tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Real client address, as restored from X-Real-IP (see the realip block below).
    # $realip_remote_addr is the proxy hop itself (the Docker bridge gateway) - kept in the log
    # so a misconfigured host that stops forwarding X-Real-IP is easy to spot.
    # Without these two a log line only ever showed the gateway for every visitor.
    log_format  main  '$remote_addr via=$realip_remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                      '"$http_user_agent" rt=$request_time';
    access_log  /dev/stdout main;

    # ---- hardening ----
    server_tokens            off;
    autoindex                off;
    absolute_redirect        off;   # never leak the internal host/port behind the proxy
    port_in_redirect         off;
    client_max_body_size     1k;    # nothing is ever uploaded
    client_body_buffer_size  1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout      10s;
    client_header_timeout    10s;
    send_timeout             30s;
    keepalive_timeout        30s;
    keepalive_requests       200;
    reset_timedout_connection on;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_errors   on;

    # Assets are gzip-compressed at build time; serve those files directly (no CPU per request).
    gzip_static on;
    gzip        on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary   on;
    gzip_proxied any;
    gzip_types  text/css application/javascript text/javascript application/json image/svg+xml
                application/wasm font/ttf font/otf application/vnd.ms-fontobject;

    # Restore the real visitor address. Behind the host nginx every TCP connection arrives from
    # the Docker bridge gateway, so without this all visitors share one rate-limit bucket (one
    # abusive client would 429 everybody). Only peers inside the private bridge ranges may set
    # it, and we read X-Real-IP - not X-Forwarded-For - because the host overwrites X-Real-IP
    # with $remote_addr (clients cannot spoof it), whereas X-Forwarded-For carries whatever the
    # client sent. real_ip_recursive stays off for the same reason: take the header as-is, do
    # not walk a client-supplied chain. If the host stops sending X-Real-IP, requests simply
    # fall back to the gateway address (shared bucket, same as before) - nothing breaks.
    set_real_ip_from  172.16.0.0/12;    # default Docker bridge and compose networks
    set_real_ip_from  10.0.0.0/8;       # custom bridge subnets
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.1/32;
    real_ip_header    X-Real-IP;
    real_ip_recursive off;

    # Who may use the app. docker/entrypoint.sh writes this table from GREEK_ALLOWED_IPS (.env)
    # each time the container starts. geo matches $remote_addr, which realip above has already
    # set to the real visitor.
    geo $greek_ip_ok {
        include /tmp/allowed-ips.conf;
    }
    # /healthz is exempt: the container healthcheck comes from 127.0.0.1 and must never depend
    # on the list. (It leaks nothing: it only answers "ok".)
    map $uri $greek_gate {
        default  $greek_ip_ok;
        /healthz 1;
    }

    # Abuse brakes, keyed per real client (the realip block above runs before these). They stay
    # generous ceilings: opening the editor fetches a burst of chunks at once.
    limit_req_zone  $binary_remote_addr zone=greek_req:2m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=greek_conn:2m;

    server {
        listen      8080 default_server;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        limit_req   zone=greek_req burst=300 nodelay;
        limit_conn  greek_conn 100;
        limit_req_status  429;
        limit_conn_status 429;

        # Not on the allow-list -> 403. `!= 1` (not `= 0`) so a table with no `default` line
        # fails closed instead of open.
        if ($greek_gate != 1) {
            return 403;
        }

        # Only GET and HEAD exist on this site.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        include /etc/nginx/snippets/security-headers.conf;

        location = /healthz {
            access_log off;
            # A location with its own add_header drops the server-level ones, so re-include.
            include /etc/nginx/snippets/security-headers.conf;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # The app shell: never cached, so an updated image is picked up on the next load.
        location = / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files /index.html =404;
        }
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # Content-hashed build output: cache for a year, never revalidate.
        location /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;

            location ~* \.wasm$ {
                include /etc/nginx/snippets/security-headers.conf;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                types { }
                default_type application/wasm;
                try_files $uri =404;
            }
        }

        location = /favicon.svg {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # Hidden files, editor backups and anything else: not served.
        location ~ /\. {
            return 404;
        }
        location / {
            return 404;
        }
    }
}
