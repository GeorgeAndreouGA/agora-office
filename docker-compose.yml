
name: greek-office

services:
  greek:
    build:
      context: .
      dockerfile: Dockerfile
    image: greek-office:1.0.0
    container_name: greek-office
    restart: unless-stopped
    init: false
    stop_grace_period: 10s

    ports:
      - "127.0.0.1:8088:8080"


    environment:
      GREEK_ALLOWED_IPS: "${GREEK_ALLOWED_IPS:?set it in .env - see .env.example}"

    # ---- isolation ----
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # ----  resource limits ----
    deploy:
      resources:
        limits:
          cpus: "1.0"       
          memory: 128M       
          pids: 64
        reservations:
          memory: 32M
    memswap_limit: 128M      
    ulimits:
      nofile:
        soft: 4096
        hard: 4096

  
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    networks:
      - greek

networks:
  greek:
    driver: bridge
